[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "buildsweep"
dynamic = ["version"]
description = "Find and remove regenerable build and dependency folders (node_modules, .venv, target, ...) in old projects."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Tigran Mkrtchyan" }]
requires-python = ">=3.9"
dependencies = []  # standard library only
keywords = ["node_modules", "cleanup", "disk-space", "build-artifacts", "cli", "developer-tools"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Build Tools",
    "Topic :: System :: Filesystems",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/tigranmk/buildsweep"
Issues = "https://github.com/tigranmk/buildsweep/issues"

[project.optional-dependencies]
# "Move to Trash" on Linux and Windows. macOS uses Finder and needs nothing extra.
trash = ["Send2Trash>=1.8"]

[project.scripts]
buildsweep = "buildsweep.cli:main"

[tool.setuptools]
packages = ["buildsweep"]

[tool.setuptools.dynamic]
version = { attr = "buildsweep.__version__" }
